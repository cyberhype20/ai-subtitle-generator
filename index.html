<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gemini 3.8 動画字幕翻訳</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
  background: #f4f6f8;
  color: #222;
}

.container {
  max-width: 760px;
  margin: auto;
  background: #fff;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin-top: 0;
}

.description {
  text-align: center;
  color: #666;
  line-height: 1.7;
  margin-bottom: 28px;
}

.section {
  margin-bottom: 22px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input,
select,
button {
  width: 100%;
  font-size: 16px;
  border-radius: 10px;
}

input[type="password"],
input[type="file"],
select {
  padding: 12px;
  border: 1px solid #ccc;
  background: white;
}

button {
  border: 0;
  padding: 15px;
  background: #4f46e5;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #4338ca;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

.small {
  font-size: 13px;
  color: #777;
  margin-top: 7px;
  line-height: 1.6;
}

.file-info {
  margin-top: 8px;
  font-size: 14px;
  color: #666;
  word-break: break-all;
}

.status {
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  background: #f1f5f9;
  white-space: pre-wrap;
  line-height: 1.6;
}

.status.error {
  background: #fef2f2;
  color: #b91c1c;
}

.status.success {
  background: #ecfdf5;
  color: #047857;
}

.progress {
  margin-top: 12px;
  height: 8px;
  background: #e5e7eb;
  border-radius: 99px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: #4f46e5;
  transition: width .3s;
}

.warning {
  margin-top: 20px;
  padding: 14px;
  border-radius: 10px;
  background: #fff7ed;
  color: #9a3412;
  font-size: 13px;
  line-height: 1.7;
}

.model {
  text-align: center;
  margin-top: 18px;
  color: #888;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AI 動画字幕翻訳</h1>

<div class="description">
動画をアップロードすると、Geminiが音声を解析し、
<br>
タイムコード付きのSRT字幕を作成します。
</div>


<!-- API KEY -->
<div class="section">

<label for="apiKey">
Gemini API Key
</label>

<input
  type="password"
  id="apiKey"
  placeholder="AIza..."
  autocomplete="off"
>

<div class="small">
Google AI Studioで取得したAPIキーを入力してください。
</div>

</div>


<!-- LANGUAGE -->
<div class="section">

<label for="targetLang">
字幕の言語
</label>

<select id="targetLang">

<option value="日本語">
日本語
</option>

<option value="English">
English
</option>

<option value="한국어">
한국어
</option>

<option value="中文">
中文
</option>

<option value="Español">
Español
</option>

<option value="Français">
Français
</option>

<option value="Deutsch">
Deutsch
</option>

<option value="Italiano">
Italiano
</option>

<option value="Português">
Português
</option>

<option value="Bahasa Indonesia">
Bahasa Indonesia
</option>

<option value="ไทย">
ไทย
</option>

<option value="Tiếng Việt">
Tiếng Việt
</option>

</select>

</div>


<!-- VIDEO -->
<div class="section">

<label for="videoFile">
動画ファイル
</label>

<input
  type="file"
  id="videoFile"
  accept="video/*"
>

<div id="fileInfo" class="file-info">
動画を選択してください。
</div>

</div>


<button id="startButton">
🎬 字幕を作成する
</button>


<div id="status" class="status">
待機中です。
</div>

<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>


<div class="warning">
⚠️ 無料枠について<br>
このツールはGemini APIのFree Tierを利用する設計です。
ただし無料枠にはGoogle側のレート制限・利用上限があります。
無料枠の範囲を超えた場合は処理できません。
APIキーを公開サイトに埋め込むことは避けてください。
</div>


<div class="model">
Gemini 3.8 Flash / Interactions API
</div>

</div>


<script>

/*
==================================================
基本設定
==================================================
*/

const MODEL = "gemini-3.8-flash";

const API_BASE =
  "https://generativelanguage.googleapis.com";


/*
==================================================
DOM
==================================================
*/

const apiKeyInput =
  document.getElementById("apiKey");

const targetLang =
  document.getElementById("targetLang");

const videoFileInput =
  document.getElementById("videoFile");

const fileInfo =
  document.getElementById("fileInfo");

const startButton =
  document.getElementById("startButton");

const statusBox =
  document.getElementById("status");

const progressBar =
  document.getElementById("progressBar");


/*
==================================================
ファイル選択
==================================================
*/

videoFileInput.addEventListener(
  "change",
  () => {

    const file =
      videoFileInput.files[0];

    if (!file) {

      fileInfo.textContent =
        "動画を選択してください。";

      return;
    }

    const mb =
      file.size / 1024 / 1024;

    fileInfo.textContent =
      `${file.name} / ${mb.toFixed(1)} MB`;

  }
);


/*
==================================================
ステータス
==================================================
*/

function setStatus(
  message,
  type = ""
) {

  statusBox.textContent =
    message;

  statusBox.className =
    "status";

  if (type) {

    statusBox.classList.add(type);

  }

}


function setProgress(value) {

  value =
    Math.max(
      0,
      Math.min(100, value)
    );

  progressBar.style.width =
    value + "%";

}


/*
==================================================
待機
==================================================
*/

function sleep(ms) {

  return new Promise(
    resolve => setTimeout(resolve, ms)
  );

}


/*
==================================================
APIエラーを読む
==================================================
*/

async function getErrorMessage(response) {

  let message = "";

  try {

    const data =
      await response.json();

    message =
      data?.error?.message ||
      JSON.stringify(data);

  } catch {

    message =
      await response.text();

  }

  return (
    message ||
    `HTTP ${response.status}`
  );

}


/*
==================================================
動画アップロード開始
==================================================
*/

async function startResumableUpload(
  file,
  apiKey
) {

  const url =
    `${API_BASE}/upload/v1beta/files?key=${encodeURIComponent(apiKey)}`;


  const response =
    await fetch(
      url,
      {

        method: "POST",

        headers: {

          "X-Goog-Upload-Protocol":
            "resumable",

          "X-Goog-Upload-Command":
            "start",

          "X-Goog-Upload-Header-Content-Length":
            String(file.size),

          "X-Goog-Upload-Header-Content-Type":
            file.type || "video/mp4",

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            file: {

              display_name:
                file.name

            }

          })

      }
    );


  if (!response.ok) {

    throw new Error(
      await getErrorMessage(response)
    );

  }


  const uploadUrl =
    response.headers.get(
      "X-Goog-Upload-URL"
    );


  if (!uploadUrl) {

    throw new Error(
      "アップロードURLを取得できませんでした。"
    );

  }


  return uploadUrl;

}


/*
==================================================
動画本体アップロード
==================================================
*/

async function uploadVideo(
  file,
  apiKey
) {

  setStatus(
    "📤 動画をGeminiへアップロードしています..."
  );

  setProgress(10);


  const uploadUrl =
    await startResumableUpload(
      file,
      apiKey
    );


  const response =
    await fetch(
      uploadUrl,
      {

        method: "POST",

        headers: {

          "Content-Length":
            String(file.size),

          "X-Goog-Upload-Offset":
            "0",

          "X-Goog-Upload-Command":
            "upload, finalize"

        },

        body:
          file

      }
    );


  if (!response.ok) {

    throw new Error(
      await getErrorMessage(response)
    );

  }


  const data =
    await response.json();


  if (!data.file) {

    throw new Error(
      "Geminiから動画情報を取得できませんでした。"
    );

  }


  setProgress(25);

  return data.file;

}


/*
==================================================
動画処理完了を待つ
==================================================
*/

async function waitUntilActive(
  fileName,
  apiKey
) {

  for (
    let i = 0;
    i < 120;
    i++
  ) {

    const url =
      `${API_BASE}/v1beta/${fileName}?key=${encodeURIComponent(apiKey)}`;


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        await getErrorMessage(response)
      );

    }


    const file =
      await response.json();


    /*
    ACTIVE
    */

    if (
      file.state === "ACTIVE"
    ) {

      setProgress(40);

      return file;

    }


    /*
    FAILED
    */

    if (
      file.state === "FAILED"
    ) {

      throw new Error(
        "Geminiで動画の処理に失敗しました。"
      );

    }


    setStatus(
      "⏳ 動画を解析できる状態にしています...\n\n" +
      `状態: ${file.state || "PROCESSING"}\n` +
      `経過時間: ${i * 5}秒`
    );


    setProgress(
      Math.min(
        40,
        25 + i * 0.2
      )
    );


    await sleep(5000);

  }


  throw new Error(
    "動画処理がタイムアウトしました。"
  );

}


/*
==================================================
Interactions API
==================================================
*/

async function createInteraction(
  file,
  language,
  apiKey
) {

  setStatus(
    "🤖 Gemini 3.8 Flashが動画を解析しています...\n\n" +
    "動画の長さによって時間がかかります。"
  );

  setProgress(50);


  const prompt = `
あなたはプロの字幕制作AIです。

アップロードされた動画を最初から最後まで確認し、
動画内で実際に話されている音声を文字起こししてください。

その後、文字起こしした内容を
「${language}」へ自然に翻訳してください。

最終的な出力はSRT字幕だけにしてください。

重要:

- 動画の実際の音声を使用すること。
- 動画の時間情報を使ってタイムコードを作ること。
- タイムコードを推測だけで作らないこと。
- 動画の最初から最後まで処理すること。
- 話していない時間には字幕を作らないこと。
- 長い発言は読みやすい長さに分割すること。
- 字幕は自然で読みやすい翻訳にすること。
- 可能な限り発話の開始・終了に近い時間を使用すること。
- 字幕番号は1から順番にすること。
- タイムコードは必ず
  HH:MM:SS,mmm --> HH:MM:SS,mmm
  の形式にすること。

出力例:

1
00:00:01,000 --> 00:00:03,500
こんにちは。

2
00:00:03,600 --> 00:00:06,000
今日は動画をご覧いただきありがとうございます。

非常に重要:

Markdownのコードブロックを使用しないでください。

説明文を書かないでください。

SRT本文だけを返してください。
`;


  const response =
    await fetch(
      `${API_BASE}/v1beta/interactions`,
      {

        method: "POST",

        headers: {

          "x-goog-api-key":
            apiKey,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            model:
              MODEL,

            input: [

              {

                type:
                  "video",

                uri:
                  file.uri,

                mime_type:
                  file.mimeType,

                processing:
                  "static"

              },

              {

                type:
                  "text",

                text:
                  prompt

              }

            ],

            generation_config: {

              /*
              無料枠を意識して
              thinkingをlowにする
              */

              thinking_level:
                "low"

            }

          })

      }
    );


  if (!response.ok) {

    const message =
      await getErrorMessage(
        response
      );


    /*
    古いモデルがまだ使われている場合の
    分かりやすいエラー
    */

    if (
      message.includes(
        "gemini-2.5-flash"
      )
    ) {

      throw new Error(
        "ブラウザが古いHTMLを実行しています。\n\n" +
        "index.htmlを保存し直して、ページを再読み込みしてください。"
      );

    }


    throw new Error(
      message
    );

  }


  const data =
    await response.json();


  /*
  Interactions APIのoutput_text
  */

  let output =
    data.output_text || "";


  /*
  念のためstepsから取得
  */

  if (
    !output &&
    Array.isArray(data.steps)
  ) {

    for (
      const step of data.steps
    ) {

      if (
        step.type ===
        "model_output"
      ) {

        if (
          Array.isArray(
            step.content
          )
        ) {

          for (
            const content
              of step.content
          ) {

            if (
              content.type ===
              "text"
            ) {

              output +=
                content.text || "";

            }

          }

        }

      }

    }

  }


  if (
    !output.trim()
  ) {

    throw new Error(
      "Geminiから字幕が返ってきませんでした。"
    );

  }


  setProgress(85);

  return output;

}


/*
==================================================
SRTクリーニング
==================================================
*/

function cleanSRT(text) {

  let srt =
    text
      .replace(
        /```srt/gi,
        ""
      )
      .replace(
        /```/g,
        ""
      )
      .trim();


  /*
  最初のSRT字幕番号を探す
  */

  const match =
    srt.match(
      /\b1\s*\n\s*\d{2}:\d{2}:\d{2},\d{3}\s*-->/m
    );


  if (match) {

    const index =
      srt.indexOf(
        match[0]
      );

    if (index > 0) {

      srt =
        srt.substring(index);

    }

  }


  /*
  Windows改行を統一
  */

  srt =
    srt.replace(
      /\r\n/g,
      "\n"
    );


  /*
  HTML改行
  */

  srt =
    srt.replace(
      /<br\s*\/?>/gi,
      "\n"
    );


  /*
  3つ以上の空行を2つへ
  */

  srt =
    srt.replace(
      /\n{3,}/g,
      "\n\n"
    );


  return srt.trim();

}


/*
==================================================
SRT検証
==================================================
*/

function validateSRT(srt) {

  const blocks =
    srt
      .split(
        /\n\s*\n/
      )
      .filter(Boolean);


  let count = 0;


  for (
    const block of blocks
  ) {

    const lines =
      block
        .split("\n")
        .map(
          x => x.trim()
        )
        .filter(Boolean);


    if (
      lines.length < 3
    ) {

      continue;

    }


    const timeLine =
      lines.find(
        line =>
          /^\d{2}:\d{2}:\d{2},\d{3}\s*-->\s*\d{2}:\d{2}:\d{2},\d{3}$/
            .test(line)
      );


    if (timeLine) {

      count++;

    }

  }


  if (
    count === 0
  ) {

    throw new Error(
      "SRT形式の字幕を取得できませんでした。\n\n" +
      "Geminiの返答:\n" +
      srt.substring(
        0,
        1000
      )
    );

  }

}


/*
==================================================
SRTダウンロード
==================================================
*/

function downloadSRT(
  srt,
  originalName
) {

  const baseName =
    originalName
      .replace(
        /\.[^/.]+$/,
        ""
      );


  const filename =
    `${baseName}_subtitle.srt`;


  /*
  UTF-8 BOM
  */

  const blob =
    new Blob(
      [
        "\uFEFF",
        srt
      ],
      {
        type:
          "application/x-subrip;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    filename;

  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    () =>
      URL.revokeObjectURL(
        url
      ),
    1000
  );

}


/*
==================================================
メイン
==================================================
*/

startButton.addEventListener(
  "click",
  async () => {

    try {

      const apiKey =
        apiKeyInput.value.trim();


      if (!apiKey) {

        throw new Error(
          "Gemini API Keyを入力してください。"
        );

      }


      const video =
        videoFileInput.files[0];


      if (!video) {

        throw new Error(
          "動画ファイルを選択してください。"
        );

      }


      if (
        !video.type.startsWith(
          "video/"
        )
      ) {

        throw new Error(
          "動画ファイルを選択してください。"
        );

      }


      const language =
        targetLang.value;


      startButton.disabled =
        true;


      setProgress(0);


      setStatus(
        "🚀 処理を開始します..."
      );


      /*
      1.
      Files APIへアップロード
      */

      const uploaded =
        await uploadVideo(
          video,
          apiKey
        );


      /*
      2.
      Gemini側の動画処理完了待ち
      */

      const activeFile =
        await waitUntilActive(
          uploaded.name,
          apiKey
        );


      /*
      3.
      Interactions API
      */

      const raw =
        await createInteraction(
          activeFile,
          language,
          apiKey
        );


      /*
      4.
      SRT整理
      */

      setStatus(
        "📝 SRT字幕を整理しています..."
      );

      setProgress(90);


      const srt =
        cleanSRT(raw);


      /*
      5.
      SRT検証
      */

      validateSRT(
        srt
      );


      /*
      6.
      ダウンロード
      */

      downloadSRT(
        srt,
        video.name
      );


      setProgress(100);


      setStatus(
        "✅ 完了しました！\n\n" +
        "SRT字幕をダウンロードしました。",
        "success"
      );


    } catch (error) {

      console.error(
        error
      );


      setProgress(0);


      setStatus(
        "❌ エラー\n\n" +
        (
          error?.message ||
          String(error)
        ),
        "error"
      );


    } finally {

      startButton.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
