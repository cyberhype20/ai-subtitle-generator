<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gemini 3.8 動画字幕翻訳</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f4f6f8;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
}

.container {
  max-width: 760px;
  margin: 0 auto;
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin-top: 0;
}

.description {
  text-align: center;
  color: #666;
  line-height: 1.7;
  margin-bottom: 28px;
}

.section {
  margin-bottom: 22px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input,
select,
button {
  width: 100%;
  font-size: 16px;
  border-radius: 10px;
}

input[type="password"],
input[type="file"],
select {
  padding: 12px;
  border: 1px solid #ccc;
  background: white;
}

button {
  padding: 15px;
  border: 0;
  background: #4f46e5;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #4338ca;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

.file-info {
  margin-top: 8px;
  color: #666;
  font-size: 14px;
  word-break: break-all;
}

.small {
  margin-top: 7px;
  font-size: 13px;
  color: #777;
  line-height: 1.6;
}

.status {
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  background: #f1f5f9;
  white-space: pre-wrap;
  line-height: 1.6;
}

.status.error {
  background: #fef2f2;
  color: #b91c1c;
}

.status.success {
  background: #ecfdf5;
  color: #047857;
}

.progress {
  height: 8px;
  margin-top: 12px;
  background: #e5e7eb;
  border-radius: 99px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: #4f46e5;
  transition: width .3s;
}

.warning {
  margin-top: 20px;
  padding: 14px;
  border-radius: 10px;
  background: #fff7ed;
  color: #9a3412;
  font-size: 13px;
  line-height: 1.7;
}

.model {
  text-align: center;
  margin-top: 18px;
  color: #888;
  font-size: 12px;
}

</style>
</head>


<body>

<div class="container">

<h1>🎬 Gemini AI 動画字幕翻訳</h1>

<div class="description">
動画をアップロードすると、
Geminiが音声を解析して
<br>
タイムコード付きのSRT字幕を作成します。
</div>


<!-- API KEY -->

<div class="section">

<label for="apiKey">
Gemini API Key
</label>

<input
  type="password"
  id="apiKey"
  placeholder="AIza..."
  autocomplete="off"
>

<div class="small">
Google AI Studioで取得したAPIキーを入力してください。
</div>

</div>


<!-- LANGUAGE -->

<div class="section">

<label for="language">
字幕の言語
</label>

<select id="language">

<option value="日本語">
日本語
</option>

<option value="English">
English
</option>

<option value="한국어">
한국어
</option>

<option value="中文">
中文
</option>

<option value="Español">
Español
</option>

<option value="Français">
Français
</option>

<option value="Deutsch">
Deutsch
</option>

<option value="Italiano">
Italiano
</option>

<option value="Português">
Português
</option>

</select>

</div>


<!-- VIDEO -->

<div class="section">

<label for="video">

動画ファイル

</label>

<input
  type="file"
  id="video"
  accept="video/*"
>

<div
  id="fileInfo"
  class="file-info"
>
動画を選択してください。
</div>

</div>


<button
  id="start"
>
🎬 字幕を作成
</button>


<div
  id="status"
  class="status"
>
待機中です。
</div>


<div class="progress">

<div
  id="progress"
  class="progress-bar"
></div>

</div>


<div class="warning">

⚠️ 無料枠について<br>

Gemini 3.8 FlashのFree Tierを使用する構成です。
ただし無料枠には利用上限があります。

また、このページはAPIキーをブラウザから使用するため、
公開サイトとして配布する場合はサーバー側でAPIキーを管理してください。

</div>


<div class="model">
Gemini 3.8 Flash / Google Gen AI SDK
</div>

</div>


<script type="module">

/*
====================================================
Google公式SDK
====================================================
*/

import {
  GoogleGenAI
} from "https://esm.sh/@google/genai@2.24.0";


/*
====================================================
モデル
====================================================
*/

const MODEL =
  "gemini-3.8-flash";


/*
====================================================
DOM
====================================================
*/

const apiKeyInput =
  document.getElementById("apiKey");

const languageInput =
  document.getElementById("language");

const videoInput =
  document.getElementById("video");

const fileInfo =
  document.getElementById("fileInfo");

const startButton =
  document.getElementById("start");

const statusBox =
  document.getElementById("status");

const progressBar =
  document.getElementById("progress");


/*
====================================================
ファイル選択
====================================================
*/

videoInput.addEventListener(
  "change",
  () => {

    const file =
      videoInput.files[0];

    if (!file) {

      fileInfo.textContent =
        "動画を選択してください。";

      return;
    }

    const mb =
      file.size / 1024 / 1024;

    fileInfo.textContent =
      `${file.name} / ${mb.toFixed(1)} MB`;

  }
);


/*
====================================================
ステータス
====================================================
*/

function status(
  message,
  type = ""
) {

  statusBox.textContent =
    message;

  statusBox.className =
    "status";

  if (type) {

    statusBox.classList.add(type);

  }

}


function progress(value) {

  progressBar.style.width =
    Math.max(
      0,
      Math.min(100, value)
    ) + "%";

}


function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}


/*
====================================================
エラーを読みやすくする
====================================================
*/

function readableError(error) {

  if (!error) {

    return "不明なエラー";

  }


  if (
    typeof error === "string"
  ) {

    return error;

  }


  if (
    error.message
  ) {

    return error.message;

  }


  try {

    return JSON.stringify(
      error,
      null,
      2
    );

  } catch {

    return String(error);

  }

}


/*
====================================================
Geminiクライアント
====================================================
*/

function createClient(apiKey) {

  return new GoogleGenAI({
    apiKey: apiKey
  });

}


/*
====================================================
動画アップロード
====================================================
*/

async function uploadVideo(
  ai,
  videoFile
) {

  status(
    "📤 動画をGeminiへアップロードしています..."
  );

  progress(10);


  const uploaded =
    await ai.files.upload({

      file:
        videoFile,

      config: {

        mimeType:
          videoFile.type ||
          "video/mp4"

      }

    });


  if (!uploaded) {

    throw new Error(
      "Geminiへの動画アップロードに失敗しました。"
    );

  }


  progress(25);

  return uploaded;

}


/*
====================================================
動画処理完了待ち
====================================================
*/

async function waitForVideo(
  ai,
  uploaded
) {

  let file =
    uploaded;


  for (
    let attempt = 0;
    attempt < 120;
    attempt++
  ) {

    /*
    ACTIVEなら完了
    */

    const state =
      file.state
        ? String(file.state)
        : "";


    if (
      state === "ACTIVE" ||
      state.endsWith(".ACTIVE")
    ) {

      progress(45);

      return file;

    }


    /*
    FAILED
    */

    if (
      state === "FAILED" ||
      state.endsWith(".FAILED")
    ) {

      throw new Error(
        "Gemini側で動画処理に失敗しました。"
      );

    }


    status(
      "⏳ 動画を処理しています...\n\n" +
      `状態: ${state || "PROCESSING"}\n` +
      `経過: ${attempt * 5}秒`
    );


    progress(
      Math.min(
        45,
        25 + attempt * 0.2
      )
    );


    await sleep(5000);


    /*
    最新状態を取得
    */

    file =
      await ai.files.get({

        name:
          file.name

      });

  }


  throw new Error(
    "動画処理がタイムアウトしました。"
  );

}


/*
====================================================
SRT生成
====================================================
*/

async function generateSRT(
  ai,
  videoFile,
  language
) {

  status(
    "🤖 Gemini 3.8 Flashが動画を解析しています...\n\n" +
    "動画の長さによって時間がかかります。"
  );

  progress(50);


  const prompt = `

あなたはプロの字幕制作AIです。

アップロードされた動画を最初から最後まで確認してください。

動画内の実際の音声を聞き取り、
音声の開始時間と終了時間を判断し、
その字幕を ${language} に翻訳してください。

最終出力はSRT形式だけにしてください。


【重要なルール】

・動画の実際の音声を使用する
・動画の実際の時間情報を使用する
・タイムコードを適当に推測しない
・動画の最初から最後まで処理する
・発話のない時間には字幕を作らない
・長すぎる字幕は適切に分割する
・自然で読みやすい${language}に翻訳する
・字幕番号は1から順番にする
・タイムコードは以下の形式にする

00:00:01,000 --> 00:00:03,500

・終了時間は開始時間より後にする


【出力形式】

1
00:00:01,000 --> 00:00:03,500
字幕テキスト

2
00:00:03,600 --> 00:00:06,000
字幕テキスト


【禁止】

Markdownコードブロックは禁止。

説明文は禁止。

「SRTはこちら」などの文章は禁止。

最終回答はSRT本文だけにしてください。

`;


  /*
  ================================================
  Interactions API
  ================================================
  */

  const interaction =
    await ai.interactions.create({

      model:
        MODEL,

      input: [

        {
          type:
            "text",

          text:
            prompt
        },

        {
          type:
            "video",

          uri:
            videoFile.uri,

          mime_type:
            videoFile.mimeType
        }

      ],

      /*
      無料枠の消費を抑えるため
      */

      generation_config: {

        thinking_level:
          "low"

      }

    });


  progress(85);


  let text =
    interaction.output_text ||
    "";


  /*
  output_textがない場合
  stepsから探す
  */

  if (
    !text &&
    Array.isArray(
      interaction.steps
    )
  ) {

    for (
      const step
        of interaction.steps
    ) {

      if (
        Array.isArray(
          step.content
        )
      ) {

        for (
          const item
            of step.content
        ) {

          if (
            item.type === "text"
          ) {

            text +=
              item.text || "";

          }

        }

      }

    }

  }


  if (
    !text.trim()
  ) {

    throw new Error(
      "Geminiから字幕が返ってきませんでした。"
    );

  }


  return text;

}


/*
====================================================
SRT整理
====================================================
*/

function cleanSRT(text) {

  let srt =
    text
      .replace(
        /```srt/gi,
        ""
      )
      .replace(
        /```/g,
        ""
      )
      .trim();


  /*
  最初の字幕から切り出す
  */

  const first =
    srt.search(
      /(?:^|\n)\s*1\s*\n\s*\d{2}:\d{2}:\d{2},\d{3}\s*-->/m
    );


  if (
    first > 0
  ) {

    srt =
      srt.substring(
        first
      );

  }


  /*
  改行統一
  */

  srt =
    srt.replace(
      /\r\n/g,
      "\n"
    );


  /*
  HTML改行
  */

  srt =
    srt.replace(
      /<br\s*\/?>/gi,
      "\n"
    );


  /*
  空行整理
  */

  srt =
    srt.replace(
      /\n{3,}/g,
      "\n\n"
    );


  return srt.trim();

}


/*
====================================================
SRT検証
====================================================
*/

function validateSRT(srt) {

  const blocks =
    srt
      .split(
        /\n\s*\n/
      )
      .filter(Boolean);


  let valid =
    0;


  for (
    const block
      of blocks
  ) {

    const lines =
      block
        .split("\n")
        .map(
          x => x.trim()
        )
        .filter(Boolean);


    if (
      lines.length < 3
    ) {

      continue;

    }


    const time =
      lines.find(
        line =>
          /^\d{2}:\d{2}:\d{2},\d{3}\s*-->\s*\d{2}:\d{2}:\d{2},\d{3}$/
            .test(line)
      );


    if (time) {

      valid++;

    }

  }


  if (
    valid === 0
  ) {

    throw new Error(
      "Geminiから正しいSRT形式の字幕を取得できませんでした。\n\n" +
      srt.substring(
        0,
        1000
      )
    );

  }


  return true;

}


/*
====================================================
SRTダウンロード
====================================================
*/

function downloadSRT(
  srt,
  originalName
) {

  const base =
    originalName
      .replace(
        /\.[^/.]+$/,
        ""
      );


  const filename =
    `${base}_subtitle.srt`;


  const blob =
    new Blob(
      [
        "\uFEFF",
        srt
      ],
      {
        type:
          "application/x-subrip;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;

  a.download =
    filename;


  document.body.appendChild(
    a
  );

  a.click();

  a.remove();


  setTimeout(
    () =>
      URL.revokeObjectURL(
        url
      ),
    1000
  );

}


/*
====================================================
メイン処理
====================================================
*/

startButton.addEventListener(
  "click",
  async () => {

    startButton.disabled =
      true;


    try {

      /*
      APIキー
      */

      const apiKey =
        apiKeyInput.value.trim();


      if (!apiKey) {

        throw new Error(
          "Gemini API Keyを入力してください。"
        );

      }


      /*
      動画
      */

      const video =
        videoInput.files[0];


      if (!video) {

        throw new Error(
          "動画ファイルを選択してください。"
        );

      }


      if (
        !video.type.startsWith(
          "video/"
        )
      ) {

        throw new Error(
          "動画ファイルを選択してください。"
        );

      }


      /*
      言語
      */

      const language =
        languageInput.value;


      progress(0);


      /*
      SDKクライアント
      */

      const ai =
        createClient(
          apiKey
        );


      /*
      1.
      アップロード
      */

      const uploaded =
        await uploadVideo(
          ai,
          video
        );


      /*
      2.
      動画処理待ち
      */

      const ready =
        await waitForVideo(
          ai,
          uploaded
        );


      /*
      3.
      字幕生成
      */

      const raw =
        await generateSRT(
          ai,
          ready,
          language
        );


      /*
      4.
      整理
      */

      status(
        "📝 SRT字幕を整理しています..."
      );

      progress(90);


      const srt =
        cleanSRT(
          raw
        );


      /*
      5.
      検証
      */

      validateSRT(
        srt
      );


      /*
      6.
      ダウンロード
      */

      downloadSRT(
        srt,
        video.name
      );


      progress(100);


      status(
        "✅ 完了しました！\n\n" +
        "SRT字幕をダウンロードしました。",
        "success"
      );


    } catch (error) {

      console.error(
        error
      );


      progress(0);


      status(
        "❌ エラーが発生しました。\n\n" +
        readableError(error),
        "error"
      );


    } finally {

      startButton.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
